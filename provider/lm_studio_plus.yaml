provider: lm_studio_plus
label:
  en_US: "LM Studio Plus"
  zh_Hans: "LM Studio Plus"
description:
  en_US: "Local AI models served by LM Studio with OpenAI-compatible API."
  zh_Hans: "加载 LM Studio 提供的本地 AI 模型，兼容 OpenAI API。"
icon_small:
  en_US: "icon.svg"
icon_large:
  en_US: "icon.svg"
background: "#F9FAFB"
help:
  title:
    en_US: "How to integrate with LM Studio Plus"
    zh_Hans: "如何集成 LM Studio Plus"
  url:
    en_US: "https://github.com/delongdk/lm-studio-plus-dify-plugin"
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter your model name, e.g. lmstudio-community/qwen2.5-7b-instruct
      zh_Hans: 输入模型名称，例如 lmstudio-community/qwen2.5-7b-instruct
  credential_form_schemas:
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: 基础 URL
      placeholder:
        en_US: "Base URL of LM Studio server, e.g. http://localhost:1234"
        zh_Hans: "LM Studio 服务器的基础 URL，例如 http://localhost:1234"
      required: true
      type: text-input
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      placeholder:
        en_US: "Enter your API key (leave 'lm-studio' if not configured)"
        zh_Hans: "输入您的 API Key（未配置认证时保留 'lm-studio'）"
      required: false
      type: secret-input
    - variable: mode
      label:
        en_US: Completion mode
        zh_Hans: 模型类型
      type: select
      required: true
      default: chat
      options:
        - label:
            en_US: Chat
            zh_Hans: 对话
          value: chat
        - label:
            en_US: Completion
            zh_Hans: 补全
          value: completion
      show_on:
        - variable: __model_type
          value: llm
    - variable: context_size
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      placeholder:
        en_US: Enter your model context size
        zh_Hans: 在此输入您的模型上下文长度
      required: true
      type: text-input
      default: "4096"
    - variable: max_tokens
      label:
        en_US: Upper bound for max tokens
        zh_Hans: 最大 token 上限
      required: true
      type: text-input
      default: "4096"
      show_on:
        - variable: __model_type
          value: llm
    - variable: vision_support
      label:
        en_US: Vision support
        zh_Hans: 是否支持 Vision
      type: radio
      required: false
      default: "false"
      options:
        - label:
            en_US: "Yes"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "No"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
    - variable: function_call_support
      label:
        en_US: Function call support
        zh_Hans: 是否支持函数调用
      type: radio
      required: false
      default: "false"
      options:
        - label:
            en_US: "Yes"
            zh_Hans: "是"
          value: "true"
        - label:
            en_US: "No"
            zh_Hans: "否"
          value: "false"
      show_on:
        - variable: __model_type
          value: llm
extra:
  python:
    provider_source: provider/lm_studio_plus.py
    model_sources:
      - "models/llm/llm.py"
      - "models/text_embedding/text_embedding.py"
