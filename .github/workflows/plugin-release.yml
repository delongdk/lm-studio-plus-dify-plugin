name: Package And Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package_and_release:
    runs-on: ubuntu-latest
    environment: release
    env:
      DIFY_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.DIFY_SIGNING_PRIVATE_KEY_PEM }}
      DIFY_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DIFY_SIGNING_PRIVATE_KEY_B64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read manifest metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          plugin_name=$(awk '/^name:/{print $2; exit}' manifest.yaml)
          version=$(awk '/^version:/{print $2; exit}' manifest.yaml)

          echo "plugin_name=$plugin_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "unsigned_package=${plugin_name}-${version}.difypkg" >> "$GITHUB_OUTPUT"
          echo "signed_package=${plugin_name}-${version}.signed.difypkg" >> "$GITHUB_OUTPUT"
          echo "public_key_name=${plugin_name}.public.pem" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches manifest version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v${{ steps.manifest.outputs.version }}"
          actual_tag="${GITHUB_REF_NAME}"

          if [[ "$actual_tag" != "$expected_tag" ]]; then
            echo "Tag $actual_tag does not match manifest version $expected_tag" >&2
            exit 1
          fi

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v${{ steps.manifest.outputs.version }}"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download Dify CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fL \
            https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64 \
            -o "$RUNNER_TEMP/bin/dify"
          chmod +x "$RUNNER_TEMP/bin/dify"
          "$RUNNER_TEMP/bin/dify" version

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/dify" plugin package . -o "${{ steps.manifest.outputs.unsigned_package }}"

      - name: Restore signing key and sign package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p signing
          private_key_path="signing/${{ steps.manifest.outputs.plugin_name }}.private.pem"
          public_key_path="signing/${{ steps.manifest.outputs.public_key_name }}"

          if [[ -n "$DIFY_SIGNING_PRIVATE_KEY_PEM" ]]; then
            printf '%s\n' "$DIFY_SIGNING_PRIVATE_KEY_PEM" > "$private_key_path"
          elif [[ -n "$DIFY_SIGNING_PRIVATE_KEY_B64" ]]; then
            printf '%s' "$DIFY_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$private_key_path"
          else
            echo "Missing GitHub Actions secret DIFY_SIGNING_PRIVATE_KEY_PEM or DIFY_SIGNING_PRIVATE_KEY_B64" >&2
            exit 1
          fi

          chmod 600 "$private_key_path"

          openssl rsa -in "$private_key_path" -RSAPublicKey_out -out "$public_key_path"

          "$RUNNER_TEMP/bin/dify" signature sign \
            "${{ steps.manifest.outputs.unsigned_package }}" \
            -p "$private_key_path"

          "$RUNNER_TEMP/bin/dify" signature verify \
            "${{ steps.manifest.outputs.signed_package }}" \
            -p "$public_key_path"

      - name: Extract release notes for tag
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ steps.release_tag.outputs.release_tag }}"
          notes_file="$RUNNER_TEMP/release_notes.md"

          awk -v tag="$release_tag" '
            $0 ~ ("^##[[:space:]]+" tag "([[:space:]]|$)") {
              in_section = 1
              found = 1
              next
            }
            in_section && $0 ~ "^##[[:space:]]+" {
              exit
            }
            in_section {
              print
            }
            END {
              if (!found) {
                exit 2
              }
            }
          ' RELEASE_NOTES.md > "$notes_file" || {
            echo "No matching release notes section found for tag $release_tag in RELEASE_NOTES.md" >&2
            exit 1
          }

          if [[ ! -s "$notes_file" ]]; then
            echo "Release notes section for tag $release_tag is empty" >&2
            exit 1
          fi

          echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            ${{ steps.manifest.outputs.unsigned_package }}
            ${{ steps.manifest.outputs.signed_package }}
            signing/${{ steps.manifest.outputs.public_key_name }}